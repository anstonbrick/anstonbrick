<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="160" fill="none">
  <defs>
    <pattern id="grid-light" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#d0d7de" opacity="0.7"/>
    </pattern>
  </defs>

  <!-- Outer container with rounded corners and border -->
  <rect x="0.5" y="0.5" width="799" height="159" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Subtle technical grid -->
  <rect x="1" y="1" width="798" height="158" rx="5" fill="url(#grid-light)"/>

  <!-- Top technical rail -->
  <line x1="0" y1="36" x2="800" y2="36" stroke="#eaeef2" stroke-width="1"/>
  <text x="24" y="23" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.5">ANSTON BRICK</text>
  <text x="776" y="23" text-anchor="end" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="1.5">BUILD · BREAK · DOCUMENT</text>

  <!-- Corner drafting marks -->
  <path d="M 24 54 L 24 46 L 32 46" fill="none" stroke="#0969da" stroke-width="1.25"/>
  <path d="M 776 130 L 776 138 L 768 138" fill="none" stroke="#d0d7de" stroke-width="1.25"/>

  <!-- Main identity typography -->
  <text x="44" y="90" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="600">&gt;_</text>
  <text x="82" y="92" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="700" letter-spacing="-0.5">anston brick</text>
  <text x="82" y="124" fill="#656d76" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" letter-spacing="0.2">systems / reverse engineering / tooling</text>

  <!-- Technical dimension tick mark on bottom right -->
  <line x1="720" y1="138" x2="760" y2="138" stroke="#d0d7de" stroke-width="1"/>
  <line x1="720" y1="134" x2="720" y2="138" stroke="#d0d7de" stroke-width="1"/>
  <line x1="740" y1="135" x2="740" y2="138" stroke="#d0d7de" stroke-width="1"/>
  <line x1="760" y1="134" x2="760" y2="138" stroke="#d0d7de" stroke-width="1"/>
</svg>
